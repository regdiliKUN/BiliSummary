# appId 必须与 src/main/shortcut.ts 里的 APP_USER_MODEL_ID 保持一致，
# 否则 Windows 上桌面快捷方式与运行中的窗口会分成两个任务栏分组。
appId: com.bilisummary.app
productName: BiliSummary
copyright: Copyright © 2026 BiliSummary

directories:
  output: release
  buildResources: resources

# 只保留中文与英文语言包。Electron 默认带 55 种语言（约 40 MB），
# 界面只有中文，其余语言只会让安装包与安装目录白白变大。
electronLanguages:
  - zh-CN
  - en-US

# ffmpeg-static 是二进制，必须解包到 asar 外面才能执行
asarUnpack:
  - node_modules/ffmpeg-static/**

files:
  - dist/**/*
  # sourcemap 只用于本地调试，不进安装包
  - "!dist/**/*.map"
  - package.json
  - node_modules/ffmpeg-static/**/*
  # 运行时只用到 ffmpeg-static 的 index.js（仅依赖 Node 内置模块）和 ffmpeg 二进制。
  # 它声明的 dependencies 全是 npm install 阶段下载二进制用的，不需要进安装包。
  - "!node_modules/ffmpeg-static/{install.js,example.js}"
  - "!node_modules/ffmpeg-static/node_modules${/*}"
  - "!node_modules/{@derhuerst,buffer-from,caseless,concat-stream,debug,env-paths,http-response-object,inherits,ms,parse-cache-control,progress,readable-stream,safe-buffer,string_decoder,typedarray,util-deprecate}${/*}"

win:
  # 图标同时用于 exe 与桌面快捷方式
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # 安装时自动在桌面创建快捷方式。
  # 应用内「设置 -> 创建桌面快捷方式」是运行时的补充入口，
  # 用于用户手动删掉快捷方式后重新创建，两者互不冲突。
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: BiliSummary
  menuCategory: false
  artifactName: ${productName}-${version}-${arch}-setup.${ext}

portable:
  artifactName: ${productName}-${version}-${arch}-portable.${ext}

mac:
  icon: resources/icon.png
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.productivity
  # dmg 默认安装到 /Applications，应用内创建的桌面快捷方式
  # 指向 /Applications/BiliSummary.app 的符号链接。
  # 注意：若改为 mas (Mac App Store) 目标，应用处于沙箱中，
  # 无权写入桌面，需要额外声明 com.apple.security.files.desktop 权限。

linux:
  icon: resources/icon.png
  target:
    - target: AppImage
      arch: [x64]
  category: Utility
  desktop:
    entry:
      Name: BiliSummary
      Comment: B站视频总结工具
      Categories: Utility;
      StartupWMClass: BiliSummary
